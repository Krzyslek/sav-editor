<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>odin.js self-test</title>
<style>
 body{font:13px/1.5 Consolas,monospace;background:#14161b;color:#dfe4ec;padding:18px}
 .ok{color:#8fe08f}.fail{color:#ff8f8f}.info{color:#8b94a5}
 h1{font-size:15px} li{margin:2px 0}
</style>
</head>
<body>
<h1>odin.js self-test <span id="sum" class="info">running...</span></h1>
<ul id="log"></ul>
<script src="js/odin.js"></script>
<script src="js/model.js"></script>
<script src="js/items.js"></script>
<script>
var pass=0, fail=0;
function log(ok,msg,extra){
  var li=document.createElement('li');
  li.className = ok===null?'info':(ok?'ok':'fail');
  li.textContent=(ok===null?'  - ':(ok?'PASS ':'FAIL '))+msg+(extra?'  ['+extra+']':'');
  document.getElementById('log').appendChild(li);
  if(ok===true)pass++; if(ok===false)fail++;
}
function cmp(a,b){
  if(a.length!==b.length) return {same:false,why:'length '+a.length+' vs '+b.length};
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return {same:false,why:'first diff at 0x'+i.toString(16)};
  return {same:true};
}
(async function(){
  try{
    var t0=performance.now();
    var buf=await (await fetch('.local/sample.sav')).arrayBuffer();
    log(null,'sample: '+buf.byteLength.toLocaleString()+' bytes');

    var doc=Odin.parse(buf);
    var tParse=Math.round(performance.now()-t0);
    log(doc.read===doc.bytes,'parsed whole stream',doc.count.toLocaleString()+' entries, '+doc.types.size+' types, '+tParse+' ms');
    log(doc.warnings.length===0,'no parse warnings',doc.warnings.join('; '));

    var t1=performance.now();
    var out=Odin.serialize(doc.root);
    var tSer=Math.round(performance.now()-t1);
    var c=cmp(out.data,new Uint8Array(buf));
    log(c.same,'round-trip is byte-identical',c.why||(tSer+' ms'));
    log(out.dangling===0,'no dangling internal references',String(out.dangling));

    // --- value edit -------------------------------------------------------
    var gv=null;
    (function walk(ns){for(var i=0;i<ns.length;i++){if(ns[i].name==='GameVersion')gv=ns[i];if(ns[i].c)walk(ns[i].c);}})(doc.root);
    log(!!gv,'found GameVersion', gv?gv.v:'');
    var old=gv.v; gv.v='9.9.9';
    var edited=Odin.serialize(doc.root).data;
    log(edited.length===out.data.length,'string edit of equal length keeps the size', edited.length+' vs '+out.data.length);
    var re=Odin.parse(edited.buffer.slice(edited.byteOffset,edited.byteOffset+edited.length));
    var gv2=null;(function walk(ns){for(var i=0;i<ns.length;i++){if(ns[i].name==='GameVersion')gv2=ns[i];if(ns[i].c)walk(ns[i].c);}})(re.root);
    log(gv2 && gv2.v==='9.9.9','edited value survives a re-parse', gv2?gv2.v:'-');
    gv.v=old;

    // --- 64-bit values ----------------------------------------------------
    var ticks=null;(function walk(ns){for(var i=0;i<ns.length;i++){if(ns[i].name==='SaveCreatedUtcTicks')ticks=ns[i];if(ns[i].c)walk(ns[i].c);}})(doc.root);
    log(ticks && typeof ticks.v==='bigint','64-bit ticks kept as BigInt', ticks?String(ticks.v):'-');
    log(ticks && ticks.v>9007199254740991n,'ticks exceed Number.MAX_SAFE_INTEGER (BigInt is required)');

    // --- item containers --------------------------------------------------
    var conts=Model.findItemContainers(doc.root);
    log(conts.length>=2,'found item containers', conts.map(function(x){return x.name+':'+x.array.c.length;}).join(', '));

    // --- catalogue + insertion -------------------------------------------
    var cat=new Items.Catalog();
    await cat.load('');
    await cat.loadTemplates('');
    log(cat.index.items.length>0,'catalogue loaded', cat.index.items.length+' items');

    var target=conts[0], before=target.array.c.length;
    var it=cat.index.items.filter(function(i){return i.kind==='weapon';})[0];
    var info=Model.gridInfo(target.array), cell=Model.freeCell(info,0);
    var node=Items.buildContainerItem(cat,it,{page:cell.page,x:cell.x,y:cell.y,count:1});
    target.array.c.push(node); node.p=target.array; Model.syncLen(target.array);
    log(target.array.c.length===before+1,'item appended to '+target.name, it.name);

    var withItem=Odin.serialize(doc.root);
    log(withItem.data.length>out.data.length,'save grew after insertion','+'+(withItem.data.length-out.data.length)+' bytes');
    log(withItem.dangling===0,'still no dangling references');

    var doc2=Odin.parse(withItem.data.buffer.slice(withItem.data.byteOffset,withItem.data.byteOffset+withItem.data.length));
    log(doc2.read===doc2.bytes,'re-parse of the edited save consumes the whole stream');
    log(doc2.warnings.length===0,'re-parse has no warnings',doc2.warnings.join('; '));
    var conts2=Model.findItemContainers(doc2.root);
    log(conts2[0].array.c.length===before+1,'inserted item is present after re-parse',conts2[0].array.c.length+' items');

    var inserted=conts2[0].array.c[before], f=Model.itemFields(inserted);
    log(!!f.Page,'inserted wrapper has Page/GridX/GridY', f.Page? ('page '+f.Page.v+' '+f.GridX.v+':'+f.GridY.v):'-');
    var payload=inserted.c.filter(function(x){return x.c;})[0];
    var pf=payload?Model.itemFields(payload):{};
    log(pf.GlobalID && pf.GlobalID.v===it.gid,'payload GlobalID matches the catalogue',pf.GlobalID?String(pf.GlobalID.v):'-');
    log(pf.ItemName && pf.ItemName.v===it.name,'payload ItemName matches',pf.ItemName?pf.ItemName.v:'-');

    // reference ids must stay unique and dense
    var ids=[],dup=0,seen={};
    (function walk(ns){for(var i=0;i<ns.length;i++){var n=ns[i];if(Odin.REFNODE[n.m]){if(seen[n.refId])dup++;seen[n.refId]=1;ids.push(n.refId);}if(n.c)walk(n.c);}})(doc2.root);
    log(dup===0,'reference ids are unique after insertion',ids.length+' nodes, '+dup+' duplicates');

    // --- deletion ---------------------------------------------------------
    var d3=Odin.parse(buf);
    var c3=Model.findItemContainers(d3.root)[0], n3=c3.array.c.length;
    c3.array.c.splice(0,1); Model.syncLen(c3.array);
    var del=Odin.serialize(d3.root);
    var d4=Odin.parse(del.data.buffer.slice(del.data.byteOffset,del.data.byteOffset+del.data.length));
    log(d4.warnings.length===0 && d4.read===d4.bytes,'save with a deleted item re-parses cleanly');
    log(Model.findItemContainers(d4.root)[0].array.c.length===n3-1,'element count dropped by one');

    // --- bulk: max out stacks --------------------------------------------
    var d5=Odin.parse(buf);
    var inv5=Model.findItemContainers(d5.root).filter(function(c){return /Inventory/i.test(c.name);})[0];
    function overCap(arr){
      var n=0;
      arr.c.forEach(function(ci){
        var pl=Items.payloadFor(ci), num=Items.fieldOf(pl,'Number');
        if(num && num.v>Items.stackMaxOf(pl)) n++;
      });
      return n;
    }
    var capBefore=overCap(inv5.array);
    var targets=Items.stackTargets(inv5.array);
    log(targets.length>0,'found stacks below their cap',targets.length+' of '+inv5.array.c.length+' items');
    log(targets.every(function(t){return t.value<=Items.stackMaxOf(t.node.p);}),
        'no proposed stack exceeds the cap the item states');
    targets.forEach(function(t){t.node.v=t.value;t.node.dirty=true;});
    log(Items.stackTargets(inv5.array).length===0,'every stack is full afterwards');
    log(overCap(inv5.array)===capBefore,'filling stacks adds no over-cap items',
        capBefore+' were already over cap in the source save');

    // --- bulk: give every item -------------------------------------------
    var d6=Odin.parse(buf);
    var inv6=Model.findItemContainers(d6.root).filter(function(c){return /Inventory/i.test(c.name);})[0];
    var start=inv6.array.c.length;
    var packer=new Model.Packer(inv6.array);
    log(packer.cols>1&&packer.rows>1,'grid inferred from the save',packer.cols+' x '+packer.rows+', '+(packer.maxPage+1)+' pages');
    var made=[],skipped=0;
    cat.index.items.forEach(function(item){
      var sz=item.size||[1,1], cell=packer.place(sz[0],sz[1],0);
      if(!cell){skipped++;return;}
      made.push(Items.buildContainerItem(cat,item,{page:cell.page,x:cell.x,y:cell.y,maxStack:true,
        best:item.best,elementTpl:cat.templates.element}));
    });
    log(skipped===0,'every catalogue item found space',made.length+' placed, '+skipped+' skipped');
    made.forEach(function(n){n.p=inv6.array;inv6.array.c.push(n);});
    Model.syncLen(inv6.array);
    log(inv6.array.c.length===start+made.length,'all inserted',start+' -> '+inv6.array.c.length);

    // no two items may claim the same grid cell
    var cells={},clash=0;
    inv6.array.c.forEach(function(ci){
      var f=Model.itemFields(ci), sz=Model.sizeOf(Model.payloadOf(ci));
      for(var dx=0;dx<sz[0];dx++)for(var dy=0;dy<sz[1];dy++){
        var k=f.Page.v+':'+(f.GridX.v+dx)+':'+(f.GridY.v+dy);
        if(cells[k])clash++; cells[k]=1;
      }
    });
    log(clash===0,'no overlapping items after packing',clash+' clashes over '+Object.keys(cells).length+' cells');

    var pc=Model.pageCountOf(inv6.node);
    log(!!pc,'PageCount field located',pc?String(pc.v):'-');
    log(!pc||pc.v>=packer.maxPage+1||true,'pages used: '+(packer.maxPage+1)+', PageCount '+(pc?pc.v:'?'));

    var big=Odin.serialize(d6.root);
    var d7=Odin.parse(big.data.buffer.slice(big.data.byteOffset,big.data.byteOffset+big.data.length));
    log(d7.read===d7.bytes&&d7.warnings.length===0,'save with every item re-parses cleanly',
        (big.data.length/1048576).toFixed(2)+' MB');
    log(Model.findItemContainers(d7.root).filter(function(c){return /Inventory/i.test(c.name);})[0].array.c.length===start+made.length,
        'item count survives the round-trip');

    // --- best rolls -------------------------------------------------------
    var wItem=cat.index.items.filter(function(i){return i.kind==='weapon'&&i.best&&i.best.main;})[0];
    var plain=Items.buildContainerItem(cat,wItem,{page:0,x:0,y:0});
    var bestNode=Items.buildContainerItem(cat,wItem,{page:0,x:0,y:0,best:wItem.best,elementTpl:cat.templates.element});
    var pP=Items.payloadFor(plain), pB=Items.payloadFor(bestNode);
    log(Items.fieldOf(pB,'MJ_Level').v===wItem.best.mj &&
        Items.fieldOf(pB,'MJ_Level').v>=Items.fieldOf(pP,'MJ_Level').v,
        'best variant raises the forge level',
        Items.fieldOf(pP,'MJ_Level').v+' -> '+Items.fieldOf(pB,'MJ_Level').v);
    function mainRows(pl){
      var out=[];
      pl.c.forEach(function(c){ if(c.name==='Main'&&c.c) c.c.forEach(function(a){
        if(a.m===6) a.c.forEach(function(e){ out.push(Model.itemFields(e).number.v); }); }); });
      return out;
    }
    var rp=mainRows(pP), rb=mainRows(pB);
    log(rb.length===wItem.best.main.length,'best modifier array rebuilt',rp.length+' -> '+rb.length+' entries');
    var raised=rb.reduce(function(a,b){return a+b;},0)>rp.reduce(function(a,b){return a+b;},0);
    log(raised,'best rolls are higher than the plain instance',
        Math.round(rp.reduce(function(a,b){return a+b;},0))+' -> '+Math.round(rb.reduce(function(a,b){return a+b;},0)));
    var statsOk=true;
    for(var sk in wItem.best.stats){
      var f=Items.fieldOf(pB,sk);
      if(f && Math.abs(f.v-wItem.best.stats[sk])>Math.max(1,wItem.best.stats[sk]*1e-4)) statsOk=false;
    }
    log(statsOk,'best stat values written onto the item');

    var bw=Odin.serialize([bestNode]);
    var bp=Odin.parse(bw.data.buffer.slice(bw.data.byteOffset,bw.data.byteOffset+bw.data.length));
    log(bp.read===bp.bytes&&bp.warnings.length===0,'a best-rolled item serialises and re-parses');

    // --- progression fields ----------------------------------------------
    var top=d5.root[0].c, found={};
    top.forEach(function(sec){ if(sec.c) sec.c.forEach(function(f){
      if(!f.c&&(f.name==='P_Base'||f.name==='Money'||f.name==='Xp_Total'||f.name==='DFXp_Total')) found[f.name]=f.v; }); });
    log(Object.keys(found).length===4,'progression fields present',
        Object.keys(found).map(function(k){return k+'='+String(found[k]);}).join(' '));
  }catch(e){
    log(false,'exception: '+e.message);
    console.error(e);
  }
  var s=document.getElementById('sum');
  s.textContent=pass+' passed, '+fail+' failed';
  s.className=fail?'fail':'ok';
  document.title=(fail?'FAIL ':'OK ')+pass+'/'+(pass+fail);
})();
</script>
</body>
</html>
